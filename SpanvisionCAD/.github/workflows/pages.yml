name: Website build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'brand.json'
      - 'index.html'
      - 'web-app.html'
      - 'site/**'
      - 'web/**'
      - 'scripts/build-site.py'
      - 'scripts/assemble-site.sh'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Install wasm-bindgen CLI
        shell: bash
        run: |
          VERSION=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Build browser app
        run: trunk build --locked --release --public-url /app/ --dist dist/app --html-output index.html web-app.html
      - name: Test and assemble website
        run: |
          python3 scripts/check_brand.py
          python3 scripts/test_site.py
          sh scripts/assemble-site.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: spanvision-cad-website
          path: dist
          if-no-files-found: error
