<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Spanvision Infra — Check the Model Data</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#080b0e;color:white;font-family:'Segoe UI',Arial,sans-serif}
body{background:radial-gradient(ellipse at 50% 51%,#202a34 0%,#10151b 40%,#07090b 78%)}
#stage{position:absolute;top:375px;width:1080px;height:1030px;mask-image:linear-gradient(transparent,black 12%,black 84%,transparent)}
#brand{position:absolute;top:105px;left:100px;right:100px;display:flex;align-items:center;justify-content:center;gap:23px}
#mark{width:76px;height:53px;background:url('/logo.png') center top/76px auto;filter:invert(1) grayscale(1);mix-blend-mode:screen}
#name{font-size:26px;letter-spacing:6px;font-weight:600;color:#d3dbe2}
#tag{position:absolute;top:221px;left:88px;right:88px;text-align:center;font-size:22px;letter-spacing:3.5px;color:#a5b4c2}
#headline{position:absolute;top:289px;left:72px;right:72px;text-align:center;white-space:pre-line;font-family:'Arial Black','Segoe UI',sans-serif;font-size:100px;font-weight:900;line-height:1.04;letter-spacing:-3px;text-shadow:0 6px 25px #0009}
#annotation{position:absolute;top:1037px;left:133px;right:133px;opacity:0;border-left:3px solid #e2c398;padding:15px 22px 16px;background:#090e14e8;box-shadow:0 14px 40px #0008;border-radius:0 10px 10px 0}
#annotation .small{font-size:22px;letter-spacing:3px;color:#aebecb}
#annotation .value{font-size:39px;font-weight:650;margin-top:8px}
#annotation .rule{font-size:26px;color:#b7c7d5;margin-top:6px;line-height:1.3}
#proof{position:absolute;top:1150px;left:105px;right:105px;opacity:0}
#prooflabel{font-size:20px;color:#aebdcc;letter-spacing:3px;text-align:center;margin-bottom:15px}
#capture{height:265px;position:relative;overflow:hidden;border-radius:9px;box-shadow:0 14px 30px #0008;border:1px solid #b4bdc544;background:#111}
#capture img{position:absolute;left:-116.4px;top:-650.5px;width:1103px;height:auto;max-width:none}
#bcf{position:absolute;top:1470px;left:105px;right:105px;text-align:center;font-size:30px;letter-spacing:4px;color:#e4ecf3;opacity:0}
#caption{position:absolute;bottom:265px;left:102px;right:102px;text-align:center;font-size:40px;line-height:1.2;font-weight:650;white-space:pre-line}
#caption span{display:inline-block;padding:12px 21px;background:#030609d4;border-radius:10px}
#cta{position:absolute;top:1420px;left:75px;right:75px;text-align:center;opacity:0}
#launch{display:inline-block;border:1px solid #cbd9e4;border-radius:50px;padding:11px 30px;letter-spacing:5px;font-size:25px}
#dm{font-family:'Arial Black','Segoe UI',sans-serif;font-size:59px;font-weight:900;letter-spacing:-1px;margin-top:33px}
#handle{margin-top:27px;font-size:24px;letter-spacing:4px;color:#b0c1ce}
</style><script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script></head><body>
<div id="stage"></div><div id="brand"><div id="mark"></div><div id="name">SPANVISION INFRA</div></div>
<div id="tag"></div><div id="headline"></div>
<div id="annotation"><div class="small">SAMPLE WALL · NAME</div><div class="value">Bad Wall Name</div><div class="rule">Required pattern: W-###…</div></div>
<div id="proof"><div id="prooflabel">RECORDED SAMPLE VALIDATION</div><div id="capture"><img src="/validation.png" alt="Actual sample validation: one requirement checked, one failed"></div></div>
<div id="bcf">IFC → IDS CHECK → BCF FINDINGS</div>
<div id="caption"><span></span></div><div id="cta"><div id="launch">LAUNCHING SOON</div><div id="dm">DM FOR PREBOOKINGS</div><div id="handle">@SPANVISIONINFRA</div></div>
<script type="module">
import * as THREE from 'three';
const info=await(await fetch('/audio-info.json')).json();
const recorded=await(await fetch('/validation.json')).json();
const record=recorded.result;
const requirement=record.specifications[0].requirements[0];
const sample=requirement.elements[0];
if(sample.element_name!=='Bad Wall Name'||record.failed_specifications!==1)throw new Error('Unexpected recorded evidence');
const cues=info.cues,find=w=>cues.find(c=>c.word===w).start;
const T={data:find('but')-.07,check:find('Check')-.07,share:find('share')-.07,vision:find('Vision')-.07,brand:find('Spanvision')-.07};
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x090d12,.0014);
const camera=new THREE.PerspectiveCamera(38,1080/1030,.1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setSize(1080,1030);renderer.setPixelRatio(1);renderer.setClearColor(0x080b0e,0);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;
document.getElementById('stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd3e3f0,0x18232e,1.4));
const key=new THREE.DirectionalLight(0xfff0dc,3.6);key.position.set(-110,200,110);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-150,right:150,top:150,bottom:-150,near:5,far:600});key.shadow.bias=-.0002;key.shadow.normalBias=.25;scene.add(key);
const rim=new THREE.DirectionalLight(0xaacfe9,2.3);rim.position.set(140,120,-120);scene.add(rim);
const fill=new THREE.DirectionalLight(0xffffff,.8);fill.position.set(100,60,120);scene.add(fill);
const silver=new THREE.MeshStandardMaterial({color:0xbac8d2,metalness:.55,roughness:.32});
const concrete=new THREE.MeshStandardMaterial({color:0x899aa7,metalness:.17,roughness:.77});
const glass=new THREE.MeshPhysicalMaterial({color:0x2e526a,metalness:.36,roughness:.18,transparent:true,opacity:.43,side:THREE.DoubleSide});
const charcoal=new THREE.MeshStandardMaterial({color:0x263441,metalness:.5,roughness:.5});
const group=new THREE.Group();scene.add(group);
function box(w,h,d,x,y,z,mat){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);return mesh}
box(148,4,104,0,0,0,charcoal);
for(let level=0;level<4;level++)box(130,2.8,82,0,3+level*25,0,concrete);
for(let level=0;level<3;level++){
 const y=16.8+level*25;
 for(const x of [-59,0,59])for(const z of [-35,35])box(3.5,23,3.5,x,y,z,silver);
 for(const z of [-38,38])for(const x of [-57,-38,-19,0,19,38,57])box(.9,23,.9,x,y,z,silver);
 box(118,22,.5,0,y,-38,glass);box(.5,22,75,-61,y,0,glass);box(.5,22,75,61,y,0,glass);
 if(level>0)box(118,22,.5,0,y,38,glass);
 else box(77,22,.5,20.5,y,38,glass);
 box(2.5,22,46,8,y,-10,concrete);box(48,22,2.5,-33,y,-4,concrete);
}
const wallmat=new THREE.MeshStandardMaterial({color:0xc3cdd6,metalness:.20,roughness:.60,transparent:true,opacity:.98});
const wall=box(38,22,2.4,-39,16.8,38,wallmat);
const wallEdge=new THREE.LineSegments(new THREE.EdgesGeometry(wall.geometry),new THREE.LineBasicMaterial({color:0xf8e2b6,transparent:true,opacity:0}));wall.add(wallEdge);
// Roof strips, parapets and a short stair make the original illustrative model readable.
for(const z of [-39,39])box(130,5,1.8,0,82,z,silver);
for(const x of [-64,64])box(1.8,5,78,x,82,0,silver);
for(let i=0;i<5;i++)box(30,1,5,0,1.5-i*.45,54+i*5,concrete);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),new THREE.MeshStandardMaterial({color:0x04070b,roughness:.8,metalness:.12}));ground.rotation.x=-Math.PI/2;ground.position.y=-2.2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(900,45,0x354555,0x202e3c);grid.position.y=-2.05;grid.material.transparent=true;grid.material.opacity=.36;scene.add(grid);
const shots=[
 {at:0,title:'LOOKS\nCOMPLETE.',tag:'A MODEL IS MORE THAN GEOMETRY'},
 {at:T.data,title:'WHAT ABOUT\nTHE DATA?',tag:'CHECK THE INFORMATION BEHIND THE MODEL'},
 {at:T.check,title:'ONE RULE.\nONE FINDING.',tag:'RECORDED WALL NAMING CHECK'},
 {at:T.share,title:'SHARE THE\nFINDING.',tag:'EXPORT BCF FINDINGS FOR REVIEW'},
 {at:T.vision,title:'VISION BIM\nVALIDATOR.',tag:'FROM SPANVISION INFRA'}
];
const $=id=>document.getElementById(id);let last=-1;
function update(t){
 let shot=0;for(let i=0;i<shots.length;i++)if(t>=shots[i].at)shot=i;
 const s=shots[shot],entry=smooth((t-s.at)/.24),closing=smooth((t-T.vision)/.6);
 if(shot!==last){$('headline').textContent=s.title;$('tag').textContent=s.tag;last=shot}
 $('headline').style.opacity=entry;$('headline').style.transform=`translateY(${(1-entry)*18}px)`;
 const examine=smooth((t-T.data)/.65)*(1-smooth((t-T.vision)/.8));
 const az=.91+t*.023;
 const radius=251+closing*18;
 camera.position.set(Math.cos(az)*radius,132+5*Math.sin(t*.20),Math.sin(az)*radius);camera.lookAt(0,36,0);
 group.position.y=closing*10;
 wall.position.z=38+examine*8;
 wallmat.color.setRGB(.69+.24*examine,.75+.03*examine,.80-.20*examine);
 wallEdge.material.opacity=examine*.85;
 $('annotation').style.opacity=smooth((t-T.data-.12)/.35)*(1-smooth((t-T.check)/.35));
 const evidence=smooth((t-T.check)/.35)*(1-smooth((t-T.vision)/.3));
 $('proof').style.opacity=evidence;$('bcf').style.opacity=evidence;
 $('stage').style.opacity=1-closing*.09;
 const cue=cues.find(c=>t>=c.start&&t<c.end&&t<T.vision);
 $('caption').style.opacity=cue?1:0;if(cue)$('caption').firstElementChild.textContent=cue.text;
 $('cta').style.opacity=closing;$('cta').style.transform=`translateY(${(1-closing)*18}px)`;
 renderer.render(scene,camera);
}
window.timeline=T;window.previewMoments=[.8,T.data+.7,T.check+.5,T.share+.35,T.vision+.8,info.duration-1.2];
window.renderFrame=async t=>{update(t);await new Promise(resolve=>requestAnimationFrame(resolve))};
await window.renderFrame(.8);window.reelReady=true;
</script></body></html>
